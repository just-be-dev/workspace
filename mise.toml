# workspace — single entry point. From a clone:
#     ./install.sh
# min_version pins a known-good mise; bump after `mise self-update`.
min_version = "2026.6.14"

[settings]
experimental = true # required for `mise bootstrap` + [dotfiles]
pin = true
dotfiles.default_mode = "symlink"

[bootstrap.packages]
# Bare package names (no repo/ prefix): mise checks installs with `pacman -Q`,
# which rejects repo-qualified names and would report them missing forever.
"pacman:fish" = "latest"
"pacman:omarchy-fish" = "latest"
# Rex (the macOS terminal) is installed in the post-tools hook below: it has no
# Homebrew cask, so the hook pulls the latest DMG from Rex's Sparkle appcast.

# Interactive rc files get "activate" (full env); login profiles get "shims" so
# non-interactive sessions still resolve tools without the activate hook.
[bootstrap.mise_shell_activate]
fish = "activate"
bashrc = "activate"
bash_profile = "shims"
zshrc = "activate"
zprofile = "shims"

[bootstrap.hooks.post-tools]
run = '''
# Pi defaults/preferences and MCP config stay machine-local. Seed once, migrate
# legacy links, and reconcile the repo-managed packages and MCP servers on
# every bootstrap.
sh "${MISE_PROJECT_ROOT:-$PWD}/pi/seed-settings.sh" || exit 1

# Herdr plugins. `herdr plugin install/link` needs a running Herdr server, so if
# none is up start a transient headless one to register them (persists on disk),
# then stop it. Must never fail the bootstrap.
if command -v herdr >/dev/null 2>&1; then
  herdr_plugins_dir="${MISE_PROJECT_ROOT:-$PWD}/herdr/plugins"
  herdr_started=0
  if ! herdr status 2>/dev/null | grep -q 'status: running'; then
    herdr server >/dev/null 2>&1 &
    for _ in $(seq 1 25); do
      if herdr status 2>/dev/null | grep -q 'status: running'; then break; fi
      sleep 0.2
    done
    herdr_started=1
  fi
  herdr plugin install nikok6/herdr-mirror --yes >/dev/null 2>&1 ||
    echo "warn: 'herdr plugin install nikok6/herdr-mirror --yes' failed; run it yourself once herdr is running" >&2

  herdr plugin install jhochenbaum/herdr-hunk-diff --yes >/dev/null 2>&1 ||
    echo "warn: 'herdr plugin install jhochenbaum/herdr-hunk-diff --yes' failed; run it yourself once herdr is running" >&2

  herdr plugin install eliasstravik/herdr-projects --yes >/dev/null 2>&1 ||
    echo "warn: 'herdr plugin install eliasstravik/herdr-projects --yes' failed; run it yourself once herdr is running" >&2

  for herdr_plugin in "$herdr_plugins_dir"/*; do
    [ -d "$herdr_plugin" ] || continue
    [ -f "$herdr_plugin/herdr-plugin.toml" ] || continue
    herdr plugin link "$herdr_plugin" >/dev/null 2>&1 ||
      echo "warn: 'herdr plugin link $herdr_plugin' failed; run it yourself once herdr is running" >&2
  done
  if [ "$herdr_started" = 1 ]; then
    herdr server stop >/dev/null 2>&1 || true
  fi
fi

# fish shell (no mise backend). omarchy-fish on Arch layers omarchy's fish config;
# Homebrew elsewhere.
if command -v pacman >/dev/null 2>&1; then
  sudo pacman -S --needed --noconfirm omarchy-fish
elif command -v fish >/dev/null 2>&1; then
  echo "fish already installed"
elif command -v brew >/dev/null 2>&1; then
  brew install fish
else
  echo "skip fish: use pacman (Arch/Omarchy) or install Homebrew (macOS)"
fi

# Rex terminal + its config, macOS only (Linux keeps omarchy's Ghostty setup).
# Rex embeds Ghostty's renderer and reads ~/.config/ghostty/config, so the
# Ghostty-format config below still applies. Rex self-updates via Sparkle after
# the first install. Must never fail the bootstrap.
if [ "$(uname)" = "Darwin" ]; then
  if ! ls -d /Applications/Rex*.app >/dev/null 2>&1; then
    rex_appcast="https://blob.superlogical.com/public/rex-app/preview/appcast.xml"
    rex_dmg_url=$(curl -fsSL "$rex_appcast" | grep -o '<enclosure[^>]*url="[^"]*\.dmg"' | head -n 1 | sed 's/.*url="\([^"]*\)"/\1/')
    rex_tmp=$(mktemp -d)
    if [ -n "$rex_dmg_url" ] && curl -fsSL -o "$rex_tmp/rex.dmg" "$rex_dmg_url" &&
      hdiutil attach -nobrowse -quiet -mountpoint "$rex_tmp/mnt" "$rex_tmp/rex.dmg"; then
      for rex_app in "$rex_tmp"/mnt/*.app; do
        [ -d "$rex_app" ] && cp -R "$rex_app" /Applications/
      done
      hdiutil detach -quiet "$rex_tmp/mnt" || true
    else
      echo "warn: Rex install failed; download it from https://rex.superlogical.com" >&2
    fi
    rm -rf "$rex_tmp"
  fi
  mkdir -p "$HOME/.config/ghostty"
  ghostty_source="${MISE_PROJECT_ROOT:-$PWD}/ghostty/config"
  ghostty_target="$HOME/.config/ghostty/config"
  if ! cmp -s "$ghostty_source" "$ghostty_target"; then
    cp "$ghostty_source" "$ghostty_target"
  fi
fi
'''

# Config symlinks. Sources are relative to this file; --force-dotfiles replaces
# existing real files.
[dotfiles]
# Global mise tools. `mise bootstrap` applies dotfiles before the tools step, so
# this symlink is in place before `mise install` runs and before post-tools hooks.
"~/.config/mise/conf.d/workspace.toml" = "mise/workspace.toml"
"~/.config/herdr/config.toml" = "herdr/config.toml"
"~/.config/herdr-mirror/hosts.toml" = "herdr-mirror/hosts.toml"
"~/.config/herdr/plugins/config/jhochenbaum.hunkdiff/config.toml" = "herdr/plugin-config/jhochenbaum.hunkdiff/config.toml"
# nvim overlays onto omarchy's base: *.lua links init.lua but skips the
# nvim-managed *.json lockfiles; symlink-each owns our lua/config + lua/plugins
# files, leaving omarchy's (options.lua, themes) in place.
"~/.config/nvim/*.lua"       = "nvim/*.lua"
"~/.config/nvim/lua/config"  = { source = "nvim/lua/config", mode = "symlink-each" }
"~/.config/nvim/lua/plugins" = { source = "nvim/lua/plugins", mode = "symlink-each" }
# ghostty NOT linked: [dotfiles] can't be OS-scoped and Linux keeps omarchy's
# config. Copied on macOS (where Rex reads it) via the post-tools hook above.
# fish conf.d: symlink-each overlays our snippets onto omarchy-fish's managed
# conf.d without clobbering the files it drops there.
"~/.config/fish/conf.d" = { source = "fish/conf.d", mode = "symlink-each" }
"~/.config/ghui/config.json" = "ghui/config.json"
"~/.config/hunk/config.toml" = "hunk/config.toml"
# pi: post-tools seeds local settings.json + mcp.json and syncs shared packages
# and MCP servers on every run (not symlinked, so machine-only servers can live
# beside the shared ones). Secrets/runtime (e.g. mcp-auth.json) stay local.
# extensions uses symlink-each to overlay (leaves e.g. omarchy-system-theme.ts).
"~/.pi/agent/extensions" = { source = "pi/agent/extensions", mode = "symlink-each" }
# Skills are directory-shaped packages. Link each skill directory explicitly:
# recursive symlink-each can follow an existing skill-directory symlink and create
# self-referential SKILL.md links inside the source tree.
"~/.agents/skills/effect-setup" = "skills/effect-setup"
"~/.agents/skills/mise-setup" = "skills/mise-setup"
"~/.agents/skills/agent-desktop" = "skills/agent-desktop"
"~/.claude/skills/effect-setup" = "skills/effect-setup"
"~/.claude/skills/mise-setup" = "skills/mise-setup"
"~/.claude/skills/agent-desktop" = "skills/agent-desktop"

[tools]
hunk = "latest"                                  # aqua:modem-dev/hunk — review-first diff viewer
"npm:@kitlangton/ghui" = "latest"                # GitHub PR TUI ("open in editor" -> nvim)
"npm:pushwork" = "latest"
"github:earendil-works/pi" = "latest"           # pi — agent harness (config tracked under pi/); GitHub release binary, npm lags (0.99 not on npm)
stylua = "latest"                                # Lua formatter for nvim config
atuin = "latest"                                  # shell history sync/search
pitchfork = "latest"                             # daemonize/supervise background processes
"github:vercel-labs/agent-desktop" = "latest"    # computer use via the OS accessibility tree (skill: skills/agent-desktop)
ripgrep = "latest"                               # rg on the global PATH: context-mode's ctx_execute sandbox can't see pi's bundled ~/.pi/agent/bin/rg
node = "26.12.1"
rust = "1.90.0"

# macOS-only: omarchy already provides these on Linux, so scoping avoids shadowing.
neovim = { version = "latest", os = ["macos"] }
gh = { version = "latest", os = ["macos"] }
"aqua:anthropics/claude-code" = { version = "latest", os = ["macos"] }
fzf = { version = "0.74.3", os = ["macos"] }
lazygit = { version = "0.64.1", os = ["macos"] }
zoxide = { version = "latest", os = ["macos"] }    # `z` (fish/conf.d/tools.fish)
eza = { version = "latest", os = ["macos"] }       # `ls` wrapper (fish/functions/ls.fish)
bat = { version = "latest", os = ["macos"] }       # `cat` wrapper (fish/functions/cat.fish)
fd = { version = "latest", os = ["macos"] }
delta = { version = "latest", os = ["macos"] }     # git pager
"npm:@openai/codex" = "0.154.0"
